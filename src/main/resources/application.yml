server:
  port: 8080
spring:
  application:
    name: nongjiale-api
  datasource:
    url: jdbc:h2:mem:nongjiale;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
nongjiale:
  contact-phone: "13651814168"
  cors-allowed-origins: "http://localhost:5173,http://localhost:5174,http://localhost:43123,http://localhost:43124"
logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"
