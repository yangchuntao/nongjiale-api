server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: nongjiale-api
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false
  cache:
    type: redis

mybatis-plus:
  type-enums-package: com.suzhong.njl.domain.enums
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 在线接口文档。默认关闭；local profile 打开，生产用 OPENAPI_ENABLED=true 显式开启。
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.suzhong.njl.web
  # 控制器未逐个声明 produces/consumes，这里统一成 JSON，避免文档里出现 */*
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

app:
  cors-allowed-origins:
    - http://localhost:43123
    - http://localhost:43124
    - http://localhost:43125
  security:
    token-ttl: 12h
  cache:
    enabled: true
    key-prefix: "njl:"
    default-ttl: 10m
    home-feed-ttl: 5m
    store-detail-ttl: 5m
    region-ttl: 30m
    site-config-ttl: 30m

wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID:}
    secret: ${WECHAT_MINIAPP_SECRET:}
