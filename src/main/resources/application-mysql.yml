# 目标库 MySQL 8。启动：--spring.profiles.active=mysql
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:njl}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:njl}
    password: ${MYSQL_PASSWORD:njl}
    driver-class-name: com.mysql.cj.jdbc.Driver
