# nongjiale-api · Nginx 站点配置
# 安装位置：/etc/nginx/sites-available/nongjiale.conf
# 启用：ln -sf /etc/nginx/sites-available/nongjiale.conf /etc/nginx/sites-enabled/nongjiale.conf
# 修改点：server_name 改成你的域名；如需 HTTPS，见 docs/DEPLOYMENT.md §10

upstream njl_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── API：HTTP ─────────────────────────────────────────────
server {
    listen 80;
    server_name example.com;   # ← 改成你的域名或公网 IP

    charset utf-8;
    client_max_body_size 4m;

    access_log /var/log/nginx/njl-api.access.log;
    error_log  /var/log/nginx/njl-api.error.log warn;

    # 探针不写访问日志，避免监控刷满磁盘
    location = /health {
        proxy_pass http://njl_api;
        access_log off;
    }

    location /api/ {
        proxy_pass http://njl_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # 以下三项只在 OPENAPI_ENABLED=true 时临时打开，生产保持注释
    # location /swagger-ui.html { proxy_pass http://njl_api; }
    # location /swagger-ui/    { proxy_pass http://njl_api; }
    # location /v3/api-docs    { proxy_pass http://njl_api; }

    # 同域子路径放前端（方案 A）时启用，注意前端构建 base 要对齐
    # location /admin/ {
    #     alias /opt/nongjiale/web/admin/;
    #     try_files $uri $uri/ /admin/index.html;
    # }
    # location /merchant/ {
    #     alias /opt/nongjiale/web/merchant/;
    #     try_files $uri $uri/ /merchant/index.html;
    # }
    # location / {
    #     root /opt/nongjiale/web/portal;
    #     try_files $uri $uri/ /index.html;
    # }
}

# ── 前端：沿用测服端口（方案 C，仅内测）─────────────────────
# 需要在百度云防火墙额外放行 43123/43124/43125。
# 此时 CORS 要包含 http://公网IP:43123 等三项。
server {
    listen 43123;
    server_name _;
    root /opt/nongjiale/web/portal;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 43124;
    server_name _;
    root /opt/nongjiale/web/admin;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 43125;
    server_name _;
    root /opt/nongjiale/web/merchant;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ /index.html; }
}

