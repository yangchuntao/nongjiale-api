<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小程序 · 可点击高保真原型</title>
<link rel="stylesheet" href="mp-tokens.css">
<style>
body {
  display:block; background:#E9EEF4; padding:0;
  background-image: radial-gradient(circle at 20% 20%, #F0F6FB 0%, #E4EBF3 60%);
  min-height:100vh;
}
.stage { display:flex; justify-content:center; gap:44px; align-items:flex-start; padding: 40px 24px 60px; }

/* 左侧控制面板 */
.panel {
  width: 244px; flex-shrink:0; position:sticky; top:40px;
  background:#fff; border-radius:18px; padding:20px;
  box-shadow:0 10px 30px rgba(26,39,51,.08);
}
.panel h1 { font-size:16px; font-weight:700; margin-bottom:4px; }
.panel .sub { font-size:11px; color:#9AA8B6; margin-bottom:18px; line-height:1.6; }
.panel .grp { margin-bottom:16px; }
.panel .grp-t { font-size:10px; color:#9AA8B6; letter-spacing:1px; margin-bottom:8px; text-transform:uppercase; }
.panel button.jump {
  display:block; width:100%; text-align:left; padding:8px 11px; margin-bottom:4px;
  border-radius:8px; background:#F5F9FC; color:#415366; font-size:12px;
  border:1px solid transparent; transition:all .15s; cursor:pointer;
}
.panel button.jump:hover { background:#E8F4FC; color:#2E7FB4; border-color:#D3E9F7; }
.panel button.jump.cur { background:#4BA3D9; color:#fff; font-weight:600; }
.panel .route-info {
  margin-top:16px; padding-top:14px; border-top:1px solid #EDF1F5;
  font-size:11px; color:#9AA8B6; line-height:1.9;
}
.panel .route-info b { color:#2E7FB4; font-family:ui-monospace,Menlo,monospace; font-size:10px; }

/* 右侧纯手机（无 wrap） */
.phone { flex-shrink:0; }

/* 点击反馈：可点元素 */
[data-go] { cursor:pointer; transition: opacity .12s, transform .12s; }
[data-go]:active { opacity:.72; transform:scale(.985); }

/* 页面切换动画 */
@keyframes slideIn { from { opacity:0; transform: translateX(14px); } to { opacity:1; transform:none; } }
@keyframes back { from { opacity:0; transform: translateX(-14px); } to { opacity:1; transform:none; } }
.anim-fwd { animation: slideIn .22s ease-out; }
.anim-back { animation: back .22s ease-out; }
.screen > .view { min-height:100%; }

/* ============ 各页面内部样式（与静态稿一致） ============ */
.mp-banner { margin: 0 var(--s4); height:168px; border-radius:var(--r-lg); overflow:hidden; position:relative; box-shadow:var(--shadow-card); background:linear-gradient(120deg,#8CCCEA 0%,#4BA3D9 55%,#5FA8CF 100%); }
.mp-banner .bdeco { position:absolute; right:-30px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.14); }
.mp-banner .bdeco2 { position:absolute; right:50px; bottom:-50px; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.10); }
.mp-banner .cap { position:absolute; left:20px; bottom:34px; color:#fff; }
.mp-banner .cap .k { font-size:10px; letter-spacing:3px; opacity:.85; }
.mp-banner .cap h2 { font-size:var(--t2); font-weight:700; margin-top:4px; text-shadow:0 2px 8px rgba(0,0,0,.12); }
.mp-banner .cap p { font-size:var(--b3); opacity:.9; margin-top:3px; }
.bdots { position:absolute; bottom:12px; right:16px; display:flex; gap:5px; }
.bdots i { width:5px; height:5px; border-radius:99px; background:rgba(255,255,255,.55); }
.bdots i.on { width:14px; background:#fff; }

.entry-main { margin:var(--s4); padding:20px; border-radius:var(--r-lg); background:linear-gradient(135deg,#FFF 0%,#F7FCFF 100%); box-shadow:var(--shadow-card); border:1px solid #EBF4FA; display:flex; align-items:center; gap:14px; }
.entry-main .ic { width:52px; height:52px; border-radius:14px; flex-shrink:0; background:linear-gradient(135deg,var(--brand),#7CC0E4); display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 6px 14px rgba(75,163,217,.28); }
.entry-main .tx { flex:1; }
.entry-main .tx b { font-size:var(--t4); display:block; margin-bottom:4px; font-weight:700; }
.entry-main .tx span { font-size:var(--b3); color:var(--text-2); }
.entry-main .arrow { color:var(--text-3); font-size:16px; }
.entry-sub { margin:0 var(--s4) var(--s4); padding:14px 18px; border-radius:var(--r-md); background:#fff; box-shadow:var(--shadow-card); display:flex; align-items:center; gap:12px; }
.entry-sub .ic { width:36px; height:36px; border-radius:10px; background:var(--info-soft); display:flex; align-items:center; justify-content:center; font-size:18px; }
.entry-sub .tx b { font-size:var(--b1); font-weight:600; }
.entry-sub .tx span { font-size:var(--cap); color:var(--text-3); margin-left:8px; }
.entry-sub .arrow { margin-left:auto; color:var(--text-3); font-size:14px; }
.service-bar { margin:0 var(--s4) var(--s4); padding:13px 18px; border-radius:var(--r-md); background:var(--brand-soft); display:flex; align-items:center; gap:10px; }
.service-bar b { font-size:var(--b2); color:var(--brand-deep); font-weight:600; }
.service-bar span { margin-left:auto; font-size:var(--b3); color:var(--brand-deep); opacity:.85; }

.sec-head { display:flex; align-items:center; justify-content:space-between; padding:0 var(--s4); margin:var(--s5) 0 var(--s3); }
.sec-head h3 { font-size:var(--t3); font-weight:700; }
.sec-head .more { font-size:var(--b3); color:var(--text-3); }
.reco-scroll { display:flex; gap:12px; padding:0 var(--s4) 4px; overflow-x:auto; }
.reco-scroll::-webkit-scrollbar { height:0; }
.reco-card { width:196px; flex-shrink:0; border-radius:var(--r-md); overflow:hidden; background:#fff; box-shadow:var(--shadow-card); }
.reco-cover { height:104px; position:relative; }
.reco-cover .tag { position:absolute; top:8px; left:8px; background:rgba(255,255,255,.94); }
.reco-body { padding:10px 12px 12px; }
.reco-body b { font-size:var(--b2); display:block; margin-bottom:5px; font-weight:600; }
.reco-body .meta { font-size:var(--cap); color:var(--text-3); }
.reco-body .p { margin-top:6px; color:var(--brand-deep); font-weight:700; font-size:var(--b1); }
.reco-body .p small { font-weight:400; font-size:10px; color:var(--text-3); }

.search-sticky { padding:8px var(--s4) 12px; background:var(--bg); }
.search-box { height:38px; border-radius:19px; background:#fff; display:flex; align-items:center; gap:8px; padding:0 14px; box-shadow:var(--shadow-card); color:var(--text-3); font-size:var(--b2); }
.city-row { display:flex; gap:8px; padding:0 var(--s4) 10px; overflow-x:auto; }
.city-row::-webkit-scrollbar { height:0; }
.chip { flex-shrink:0; padding:6px 15px; border-radius:99px; background:#fff; color:var(--text-2); font-size:var(--b3); border:1px solid var(--line); }
.chip.on { background:var(--brand); color:#fff; border-color:var(--brand); font-weight:600; box-shadow:0 3px 8px rgba(75,163,217,.28); }
.list-card { display:flex; gap:12px; margin:0 var(--s4) 12px; padding:12px; border-radius:var(--r-md); background:#fff; box-shadow:var(--shadow-card); }
.lc-cover { width:96px; height:96px; border-radius:10px; flex-shrink:0; }
.lc-body { flex:1; min-width:0; display:flex; flex-direction:column; }
.lc-body b { font-size:var(--b1); font-weight:600; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lc-body .sub { font-size:var(--b3); color:var(--text-2); margin-bottom:4px; }
.lc-body .sell { font-size:var(--cap); color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lc-foot { margin-top:auto; display:flex; align-items:center; justify-content:space-between; }
.lc-foot .p { color:var(--brand-deep); font-weight:700; font-size:var(--b1); }
.lc-foot .p small { font-size:10px; font-weight:400; color:var(--text-3); }
.lc-foot .tel { font-size:var(--cap); color:var(--text-3); }

.gallery { height:222px; position:relative; }
.gallery .img { height:100%; background:linear-gradient(135deg,#A8D8F0,#4BA3D9 70%,#3A8FC4); position:relative; }
.gallery .gd { position:absolute; left:-40px; bottom:-70px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.12); }
.gallery .gd2 { position:absolute; right:20px; top:-30px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.10); }
.gallery .idx { position:absolute; right:14px; bottom:14px; background:rgba(0,0,0,.38); color:#fff; font-size:11px; padding:3px 9px; border-radius:99px; }
.gallery .dots2 { position:absolute; left:0; right:0; bottom:14px; display:flex; justify-content:center; gap:5px; }
.gallery .dots2 i { width:5px; height:5px; border-radius:99px; background:rgba(255,255,255,.6); }
.gallery .dots2 i.on { width:14px; background:#fff; }
.detail-body { background:#fff; margin-top:-16px; border-radius:18px 18px 0 0; position:relative; padding:18px var(--s4) var(--s4); }
.detail-body h1 { font-size:var(--t3); font-weight:700; line-height:1.35; }
.detail-price { margin-top:10px; display:flex; align-items:baseline; gap:6px; }
.detail-price b { font-size:28px; color:var(--brand-deep); font-weight:700; }
.detail-price span { font-size:var(--b3); color:var(--text-3); }
.addr { margin-top:12px; display:flex; align-items:flex-start; gap:8px; font-size:var(--b3); color:var(--text-2); line-height:1.5; }
.addr .act { margin-left:auto; color:var(--brand); font-size:var(--cap); white-space:nowrap; display:flex; gap:12px; }
.notice-bar { margin:var(--s3) 0 0; padding:11px 14px; border-radius:10px; background:var(--brand-soft); color:var(--brand-deep); font-size:var(--b3); display:flex; align-items:center; gap:8px; }
.block { padding:var(--s4); background:#fff; margin-top:10px; }
.block h4 { font-size:var(--b1); font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.block h4::before { content:""; width:3px; height:14px; border-radius:2px; background:var(--brand); }
.pkg { display:flex; align-items:center; gap:12px; padding:12px 0; }
.pkg + .pkg { border-top:1px dashed var(--line); }
.pkg .pi { width:40px; height:40px; border-radius:10px; background:var(--brand-soft); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.pkg .pt { flex:1; }
.pkg .pt b { font-size:var(--b2); font-weight:600; display:block; margin-bottom:3px; }
.pkg .pt span { font-size:var(--cap); color:var(--text-3); }
.pkg .pp { color:var(--brand-deep); font-weight:700; font-size:var(--b2); }
.kv { display:flex; font-size:var(--b3); color:var(--text-2); padding:7px 0; }
.kv .k { width:74px; color:var(--text-3); flex-shrink:0; }
.kv .v { flex:1; color:var(--text-1); }

.cta-bar { position:absolute; left:0; right:0; bottom:0; z-index:70; background:rgba(255,255,255,.97); backdrop-filter:blur(20px); border-top:1px solid var(--line); padding:10px var(--s4) calc(10px + var(--safe-bottom)); display:flex; gap:10px; align-items:center; }
.cta-bar .share-btn { width:48px; height:48px; border-radius:var(--r-md); flex-shrink:0; border:1px solid var(--line); background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:9px; color:var(--text-2); }
.cta-bar .share-btn .i { font-size:17px; }
.cta-main { flex:1; }
.cta-sub { font-size:10px; color:var(--text-3); text-align:center; margin-top:4px; }

.login-wrap { padding:40px var(--s5) 0; display:flex; flex-direction:column; min-height:100%; }
.login-brand { text-align:center; margin-bottom:32px; }
.login-logo { width:68px; height:68px; border-radius:20px; margin:0 auto 18px; background:linear-gradient(135deg,var(--brand),#7CC0E4); display:flex; align-items:center; justify-content:center; font-size:30px; color:#fff; font-weight:700; box-shadow:0 10px 26px rgba(75,163,217,.35); }
.login-brand h1 { font-size:var(--t2); font-weight:700; margin-bottom:10px; }
.login-brand p { font-size:var(--b2); color:var(--text-2); }
.login-steps { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px; }
.step { display:flex; align-items:center; gap:6px; font-size:var(--cap); color:var(--text-3); }
.step .n { width:18px; height:18px; border-radius:50%; background:#E4EBF2; color:var(--text-3); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; }
.step.on { color:var(--brand); font-weight:600; }
.step.on .n { background:var(--brand); color:#fff; }
.step-line { width:22px; height:1px; background:var(--line); }
.login-form { background:#fff; border-radius:var(--r-lg); padding:20px var(--s4); box-shadow:var(--shadow-card); }
.fld { margin-bottom:16px; }
.fld label { display:block; font-size:var(--b3); color:var(--text-2); margin-bottom:8px; }
.fld .box { height:48px; border-radius:var(--r-md); background:#F6F9FB; border:1px solid var(--line); display:flex; align-items:center; padding:0 14px; font-size:var(--b1); color:var(--text-3); }
.fld .code-row { display:flex; gap:10px; }
.fld .code-row .box { flex:1; }
.fld .code-btn { width:110px; height:48px; border-radius:var(--r-md); background:var(--brand-soft); color:var(--brand-deep); display:flex; align-items:center; justify-content:center; font-size:var(--b2); font-weight:600; flex-shrink:0; }
.login-actions { margin-top:auto; padding-bottom:calc(20px + var(--safe-bottom)); }
.login-actions .skip { text-align:center; font-size:var(--b2); color:var(--text-3); padding:16px; }
.login-tip { text-align:center; font-size:var(--cap); color:var(--text-3); line-height:1.7; margin-top:16px; }

.form-top-banner { padding:14px var(--s4); background:var(--brand-soft); display:flex; gap:10px; align-items:flex-start; }
.form-top-banner .i { font-size:15px; flex-shrink:0; margin-top:1px; }
.form-top-banner p { font-size:var(--b3); color:var(--brand-deep); line-height:1.6; }
.readonly-store { display:flex; gap:12px; padding:var(--s4); background:#fff; align-items:center; }
.readonly-store .c { width:56px; height:56px; border-radius:10px; background:linear-gradient(135deg,#C2E2F4,#5FA8CF); flex-shrink:0; }
.readonly-store .t b { font-size:var(--b1); font-weight:600; display:block; margin-bottom:5px; }
.readonly-store .t span { font-size:var(--b3); color:var(--text-2); }
.form-body { background:#fff; margin-top:10px; padding:4px var(--s4) 8px; }
.frow { display:flex; align-items:center; min-height:54px; border-bottom:1px solid var(--line); }
.frow:last-child { border-bottom:none; }
.frow .lb { width:80px; font-size:var(--b2); color:var(--text-1); flex-shrink:0; }
.frow .lb em { color:var(--danger); font-style:normal; margin-right:2px; }
.frow .vl { flex:1; font-size:var(--b2); color:var(--text-1); }
.frow .vl.ph { color:var(--text-3); }
.frow .ar { color:var(--text-3); font-size:14px; }
.frow .stepper { display:flex; align-items:center; }
.frow .stepper span { width:30px; height:30px; border-radius:8px; background:#F4F7FA; display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:15px; }
.frow .stepper b { min-width:38px; text-align:center; font-size:var(--b2); font-weight:600; }
.frow .unit-label { font-size:var(--b3); color:var(--text-3); margin-left:8px; }
.nights-tip { padding:10px var(--s4); font-size:var(--cap); color:var(--text-3); background:#fff; }
.form-cta { position:absolute; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px var(--s4) calc(10px + var(--safe-bottom)); z-index:70; }
.no-pay { text-align:center; font-size:10px; color:var(--text-3); margin-top:6px; }

.succ-wrap { padding:36px var(--s5) 0; display:flex; flex-direction:column; min-height:100%; }
.succ-icon { width:78px; height:78px; border-radius:50%; margin:0 auto 22px; background:linear-gradient(135deg,#7CC0E4,var(--brand)); display:flex; align-items:center; justify-content:center; font-size:36px; color:#fff; box-shadow:0 12px 30px rgba(75,163,217,.34); }
.succ-wrap h1 { font-size:var(--t2); font-weight:700; text-align:center; margin-bottom:8px; }
.succ-wrap .sub { font-size:var(--b2); color:var(--text-2); text-align:center; margin-bottom:24px; }
.order-no { background:#fff; border-radius:var(--r-md); padding:16px var(--s4); display:flex; align-items:center; box-shadow:var(--shadow-card); margin-bottom:12px; }
.order-no .k { font-size:var(--b3); color:var(--text-2); }
.order-no .v { margin-left:auto; font-family:ui-monospace,Menlo,monospace; font-size:var(--b1); font-weight:700; letter-spacing:.4px; }
.order-no .cp { margin-left:10px; font-size:var(--cap); color:var(--brand); }
.info-card { background:#fff; border-radius:var(--r-md); padding:4px var(--s4); box-shadow:var(--shadow-card); margin-bottom:12px; }
.info-card .kv2 { display:flex; padding:12px 0; font-size:var(--b2); border-bottom:1px solid var(--line); }
.info-card .kv2:last-child { border:none; }
.info-card .kv2 .k { color:var(--text-3); width:76px; flex-shrink:0; font-size:var(--b3); }
.info-card .kv2 .v { color:var(--text-1); }
.lock-notice { background:#fff; border-radius:var(--r-md); padding:var(--s4); box-shadow:var(--shadow-card); margin-bottom:20px; border-left:3px solid var(--brand); }
.lock-notice p { font-size:var(--b3); color:var(--text-2); line-height:1.75; }
.lock-notice p + p { margin-top:6px; }
.lock-notice b { color:var(--text-1); font-weight:700; }
.succ-actions { margin-top:auto; padding-bottom:calc(16px + var(--safe-bottom)); display:flex; flex-direction:column; gap:10px; }

.radius-tip { padding:12px var(--s4); font-size:var(--cap); color:var(--text-3); line-height:1.6; }
.info-banner { margin:0 var(--s4) 12px; padding:12px 14px; border-radius:10px; background:var(--info-soft); display:flex; gap:9px; align-items:flex-start; }
.info-banner .i { font-size:14px; }
.info-banner p { font-size:var(--cap); color:var(--brand-deep); line-height:1.6; }
.intent-card { margin:0 var(--s4) 12px; background:#fff; border-radius:var(--r-md); padding:14px var(--s4); box-shadow:var(--shadow-card); }
.intent-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.intent-head .no { font-size:var(--cap); color:var(--text-3); font-family:ui-monospace,Menlo,monospace; }
.intent-body { display:flex; gap:12px; }
.intent-body .c { width:60px; height:60px; border-radius:9px; flex-shrink:0; }
.intent-body .t { flex:1; min-width:0; }
.intent-body .t b { font-size:var(--b1); font-weight:600; display:block; margin-bottom:6px; }
.intent-body .t .d { font-size:var(--b3); color:var(--text-2); margin-bottom:3px; }
.intent-body .t .n { font-size:var(--cap); color:var(--text-3); }
.intent-foot { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:flex; align-items:center; }
.intent-foot span { font-size:var(--cap); color:var(--text-3); }
.intent-foot .go { margin-left:auto; font-size:var(--b3); color:var(--brand); }

.guide-card { margin:0 var(--s4) 12px; background:#fff; border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-card); }
.guide-cover { height:132px; position:relative; }
.guide-cover .cat { position:absolute; left:10px; top:10px; background:rgba(255,255,255,.94); }
.guide-cover .gd { position:absolute; right:-20px; bottom:-40px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.14); }
.guide-body { padding:12px var(--s4) 14px; }
.guide-body h3 { font-size:var(--b1); font-weight:700; line-height:1.45; margin-bottom:7px; }
.guide-body p { font-size:var(--b3); color:var(--text-2); line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.guide-meta { margin-top:10px; display:flex; align-items:center; gap:8px; font-size:var(--cap); color:var(--text-3); }

.article-head { padding:20px var(--s4) 16px; background:#fff; }
.article-head h1 { font-size:var(--t3); font-weight:700; line-height:1.42; margin-bottom:12px; }
.article-meta { display:flex; align-items:center; gap:10px; font-size:var(--cap); color:var(--text-3); }
.article-meta .av { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,var(--brand),#7CC0E4); display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; }
.article-cover { height:184px; background:linear-gradient(135deg,#9FD3EC,#4BA3D9 65%,#3A8FC4); position:relative; }
.article-cover .gd { position:absolute; left:-30px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.12); }
.article-body { background:#fff; padding:20px var(--s4) 28px; }
.article-body p { font-size:15px; line-height:1.95; color:#33414F; margin-bottom:16px; }

/* ---------- 渲染 ---------- */
function render(route, direction = 'fwd') {
  current = route;
  const m = meta[route] || meta.home;

  navTitle.textContent = m.title || '';
  navBack.style.display = m.back ? 'block' : 'none';
  navShare.style.display = m.share ? 'block' : 'none';
  tabbar.style.display = m.tab ? 'flex' : 'none';

  // 详情页导航透明浮在图上
  const nav = document.getElementById('nav');
  if (m.transparent) {
    nav.style.position = 'absolute';
    nav.style.top = 'var(--safe-top)';
    nav.style.left = '0'; nav.style.right = '0';
    nav.style.color = '#fff';
    navBack.style.display = 'block';
    navBack.style.color = '#fff';
    navBack.style.textShadow = '0 1px 4px rgba(0,0,0,.35)';
    navShare.style.color = '#fff';
    navShare.style.textShadow = '0 1px 4px rgba(0,0,0,.35)';
  } else {
    nav.style.position = '';
    nav.style.top = ''; nav.style.left = ''; nav.style.right = '';
    nav.style.color = '';
    navBack.style.color = '';
    navBack.style.textShadow = '';
    navShare.style.color = '';
    navShare.style.textShadow = '';
  }

  screens.innerHTML = views[route] ? views[route]() : '<div class="view">404</div>';
  screens.scrollTop = 0;
  screens.querySelector('.view')?.classList.add(direction === 'back' ? 'anim-back' : 'anim-fwd');
  screens.style.paddingBottom = '0';

  // Tab 高亮
  tabbar.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('on', t.dataset.go === route);
  });

  // 面板状态
  document.getElementById('routeName').textContent = route;
  document.getElementById('stackInfo').textContent = stack.length ? stack.join(' → ') : '空';
  document.querySelectorAll('.panel .jump').forEach(b => b.classList.toggle('cur', b.dataset.jump === route));
}

function go(route, opts = {}) {
  if (route === current) return;
  const isTab = TAB_PAGES.includes(route);
  if (!opts.replace && !isTab) stack.push(current);
  if (isTab) stack = [];            // switchTab 清栈
  render(route, 'fwd');
}

function back() {
  const prev = stack.pop();
  render(prev || 'home', 'back');
}

/* ---------- 浮层 ---------- */
function showSheet() {
  const el = document.createElement('div');
  el.className = 'sheet-mask';
  el.innerHTML = `
    <div class="sheet">
      <div class="st">转发给朋友 / 分享到</div>
      <div class="srow">
        <div class="si"><div class="b">💬</div>微信好友</div>
        <div class="si"><div class="b">👥</div>群聊</div>
        <div class="si"><div class="b">🖼️</div>生成卡片</div>
        <div class="si"><div class="b">🔗</div>复制链接</div>
      </div>
      <div class="cancel">取消</div>
    </div>`;
  el.addEventListener('click', e => { if (e.target === el || e.target.classList.contains('cancel')) el.remove(); });
  document.querySelector('.phone').appendChild(el);
}

function showDialog() {
  const el = document.createElement('div');
  el.className = 'dialog-mask';
  el.innerHTML = `
    <div class="dialog">
      <div class="dt"><b>该链接需在浏览器打开</b><p>复制链接后，在浏览器粘贴访问</p></div>
      <div class="dacts"><div>取消</div><div>复制链接</div></div>
    </div>`;
  el.addEventListener('click', e => {
    if (e.target.textContent === '复制链接') { el.remove(); toast('已复制，请到浏览器粘贴打开'); }
    else if (e.target === el || e.target.textContent === '取消') el.remove();
  });
  document.querySelector('.phone').appendChild(el);
}

let toastTimer;
function toast(msg) {
  let t = document.querySelector('.phone > .toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.querySelector('.phone').appendChild(t); }
  t.textContent = msg;
  t.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hide'), 1600);
}

/* ---------- 事件委托 ---------- */
document.addEventListener('click', e => {
  const t = e.target;

  // 返回
  if (t.id === 'navBack' || t.dataset.back !== undefined) { back(); return; }

  // 面板跳转
  if (t.dataset.jump) { go(t.dataset.jump); return; }

  // 分享面板
  if (t.dataset.sheet) { showSheet(); return; }

  // 复制链接演示（Banner 外链场景）
  if (t.dataset.toast) { toast(t.dataset.toast); return; }

  // tel
  if (t.dataset.tel) { toast('调起系统拨号 400-000-0000'); return; }

  // 详情主 CTA：未登录 → 登录；已登录 → 表单
  if (t.dataset.submitIntent !== undefined) {
    if (!loggedIn) { toast('需要授权后才能提交意向'); go('login'); }
    else go('intent_form');
    return;
  }

  // 登录成功
  if (t.dataset.loginOk !== undefined) {
    loggedIn = true;
    toast('登录成功');
    setTimeout(() => { back(); }, 500);
    return;
  }

  // 人数加减（局部更新，不整页重渲染，避免动画与滚动跳动）
  if (t.dataset.plus !== undefined || t.dataset.minus !== undefined) {
    personCount = t.dataset.plus !== undefined
      ? Math.min(8, personCount + 1)
      : Math.max(1, personCount - 1);
    const b = document.getElementById('pCount');
    if (b) b.textContent = personCount;
    const tip = document.querySelector('.nights-tip');
    if (tip) tip.textContent = `共 2 晚 · ${personCount} 人 · 客服确认档期后回复`;
    return;
  }

  // 页面跳转（含底栏 Tab）
  const goEl = t.closest('[data-go]');
  if (goEl) { go(goEl.dataset.go); }
});

/* ---------- 启动 ---------- */
render('home');
</script>
